<head>

<style>
:root{
  --bg:#f6f2ee; --panel:#ffffff; --ink:#1d1517; --muted:#6f6366; --line:#e6dcd8; --soft:#f1ebe8;
  --fas:#8c1d2c; --gold:#c99a2e; --closed:#a59a9c; --danger:#b3261e; --ok:#2e7d4f;
  --azul:#2a5fb0; --naranja:#e07818; --verde:#2e8b57; --violeta:#7a4fb5; --celeste:#2b9cc4; --amarillo:#c9a100; --gris:#6b7280; --rosa:#d14d8b;
}
@media (prefers-color-scheme: dark) and (min-width:701px){
  :root:not([data-theme="light"]){
    --bg:#151012; --panel:#1f181a; --ink:#f3ecea; --muted:#a8999c; --line:#352a2d; --soft:#2a2124;
    --fas:#d2485c; --gold:#e0b44c; --closed:#6f6467; --danger:#f08a80; --ok:#6cc495;
    --azul:#5e93e6; --naranja:#f29a45; --verde:#5bbf86; --violeta:#a985e0; --celeste:#5ec3e6; --amarillo:#e6c43c; --gris:#9aa1ad; --rosa:#ef7fb2;
  }
}
:root[data-theme="dark"]{
  --bg:#151012; --panel:#1f181a; --ink:#f3ecea; --muted:#a8999c; --line:#352a2d; --soft:#2a2124;
  --fas:#d2485c; --gold:#e0b44c; --closed:#6f6467; --danger:#f08a80; --ok:#6cc495;
  --azul:#5e93e6; --naranja:#f29a45; --verde:#5bbf86; --violeta:#a985e0; --celeste:#5ec3e6; --amarillo:#e6c43c; --gris:#9aa1ad; --rosa:#ef7fb2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
header img{height:56px;width:auto;border-radius:8px;display:block}
h1{font-family:"Archivo Narrow",Archivo,sans-serif;font-size:28px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1.05}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fas);border-color:var(--fas);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:5px 9px;font-size:12px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab.add{color:var(--fas)}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:14px;padding:0}
.card.hero{padding:0}
.score{padding:18px}
.score+.score{border-left:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.score{position:relative;overflow:hidden}
.score .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.chip{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.score .num{font-size:40px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.score .pct{font-size:15px;color:var(--muted);font-weight:600}
.score.win .lbl::after{content:"GANADORA";margin-left:4px;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:999px;background:var(--gold);color:#1d1517}
.splitbar{grid-column:1/-1;padding:16px 18px 18px;border-top:1px solid var(--line)}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--soft)}
.bar>div{height:100%}
.barmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px;gap:8px;flex-wrap:wrap}
.barmeta b{color:var(--ink)}

details.grupos{margin-top:14px;padding:0}
details.grupos summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
details.grupos summary::-webkit-details-marker{display:none}
details.grupos summary .chev{width:18px;height:18px;transition:transform .15s;color:var(--muted);flex:none}
details.grupos[open] summary .chev{transform:rotate(90deg)}
details.grupos summary .peek{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted);text-align:right}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.kpi{padding:14px 18px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:13px;color:var(--muted);margin-top:2px}

.tablecard{padding:0;overflow:hidden}
.tablehead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.tablehead h2{font-size:15px;margin:0;font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--soft)}
th:first-child,td:first-child{text-align:left}
tbody tr{border-top:1px solid var(--line)}
tbody tr.sum{background:var(--soft);font-weight:700}
tbody tr.sum.first{border-top:2px solid var(--ink)}
td.casino{font-weight:600}
.big{font-size:17px;font-weight:700}
.sm{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.th{display:inline-flex;align-items:center;gap:6px}
table.main{min-width:560px}
table.main td{padding:10px 14px}
.mbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft);min-width:90px}
.mbar>div{height:100%}
td.pc{color:var(--muted);font-size:13px}
.lead{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.closed td{color:var(--closed)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px;border-radius:999px;color:var(--muted)}
.hidediff .diff{display:none}
.note{font-size:12px;color:var(--muted);padding:10px 18px 14px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.hero+.tablecard{margin-top:0}

.cmp-pos{color:var(--fas);font-weight:700}
.cmp-neg{color:var(--muted);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dumb{position:relative;height:18px;min-width:180px}
.dumb .track{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line)}
.dumb .mid{position:absolute;left:50%;top:2px;width:1px;height:14px;background:var(--muted);opacity:.5}
.dumb .seg{position:absolute;top:7px;height:4px;background:var(--fas);opacity:.35;border-radius:2px}
.dumb .p{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;margin-left:-6px;border:2px solid var(--panel)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select:focus,input:focus{outline:2px solid var(--fas);outline-offset:-1px;border-color:transparent}

/* formulario */
.form h2{margin:0 0 4px;font-size:20px}
.form .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.fields{display:grid;grid-template-columns:140px 1fr auto;gap:14px;align-items:end;margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field input{width:100%}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.vt td{padding:6px 10px}
.vt th:nth-child(2),.vt th:nth-child(3){width:20%}
.vt th:nth-child(4){width:14%}
.vt th:nth-child(5){width:12%;text-align:center}
.vt td.gc{padding:0;border-left:1px solid var(--line);position:relative;min-width:110px}
.vt .g{display:block;width:100%;height:40px;border:0;border-radius:0;background:transparent;text-align:right;padding:0 12px;font:inherit;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;caret-color:var(--ink);-webkit-user-select:text}
.vt .g:focus{outline:none}
.vt .g[readonly]{caret-color:transparent;cursor:cell}
.vt .g[readonly]::selection{background:transparent}
.vt .g.newname{text-align:left;min-width:170px;font-weight:600}
.vt td.gc.sel{box-shadow:inset 0 0 0 2px var(--fas);z-index:1}
.vt td.gc.editing{background:var(--soft)}
.vt tr.off .vf,.vt tr.off .vr{color:var(--closed);text-decoration:line-through}
.gchk{display:flex!important;align-items:center;justify-content:center;cursor:cell}
.gchk .box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center}
.gchk[aria-checked="true"] .box{background:var(--fas);border-color:var(--fas)}
.gchk[aria-checked="true"] .box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.keys{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.keys #addCasino{margin-right:6px}
kbd{font:inherit;font-size:11px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--ink)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;margin-top:10px}
.okmsg{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.datos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-right:auto}
.dlnote{font-size:11px;color:var(--muted);max-width:190px;line-height:1.3}


/* ---- compacto: todo entra en la pantalla ---- */
.wrap{padding:14px 20px 16px;max-width:940px}
header{gap:14px;margin-bottom:12px;flex-wrap:wrap}
header img{height:42px}
h1{font-size:22px}
.sub{font-size:12px}
.ttl{min-width:0}
header .tabs{margin:0 0 0 auto}
.tabs{margin-bottom:12px;padding:3px}
.tab{padding:6px 12px;font-size:13px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hnote{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px}
.hero{grid-template-columns:auto 1fr auto;grid-template-areas:"a bar b";align-items:center;margin-bottom:10px}
.hero .score:nth-of-type(1){grid-area:a}
.hero .score:nth-of-type(2){grid-area:b;text-align:right;border-left:0}
.hero .score:nth-of-type(2) .lbl{justify-content:flex-end}
.hero .splitbar{grid-area:bar;border-top:0;padding:10px 8px}
.hero:not(:has(.splitbar)){grid-template-columns:1fr 1fr;grid-template-areas:"a b"}
.hero:not(:has(.splitbar)) .score:nth-of-type(2){border-left:1px solid var(--line);text-align:left}
.hero:not(:has(.splitbar)) .score:nth-of-type(2) .lbl{justify-content:flex-start}
.score{padding:10px 18px;min-width:170px}
.score .num{font-size:28px;margin-top:2px;line-height:1.1}
.score .pct{font-size:13px}
.score .lbl{font-size:11px}
.bar{height:12px}
.barmeta{font-size:12px;margin-top:6px}
.tablehead{padding:8px 14px}
.tablehead h2{font-size:14px}
th{padding:6px 12px;font-size:10px}
table.main td{padding:4px 14px}
.big{font-size:15px}
.sm{font-size:11px}
.lead{font-size:14px}
details.grupos{margin-top:10px}
details.grupos summary{padding:9px 14px;font-size:14px}
.kpi{padding:10px 14px}
.kpi .v{font-size:18px}
#view>.legend{margin-bottom:10px!important}
.tablecard table:not(.main):not(.vt) td{padding:5px 12px}
.vt .g{height:29px;font-size:14px}
.vt td{padding:3px 10px}
.form h2{font-size:17px}
.form .hint{margin-bottom:10px}
.fields{margin-bottom:12px;gap:10px}
.card{padding:14px 16px}
.card.hero,.tablecard,details.grupos{padding:0}
table.main td{padding:3px 14px}
.tablecard table:not(.main):not(.vt) td{padding:3px 12px}
.dumb{height:14px}.dumb .track{top:6px}.dumb .mid{top:0}.dumb .seg{top:5px}.dumb .p{top:1px;width:11px;height:11px}
@media (min-width:701px) and (max-height:800px){
  .wrap{padding-top:10px;padding-bottom:10px}
  header{margin-bottom:8px}
  header img{height:36px}
  h1{font-size:19px}
  .sub{display:none}
  .score{padding:7px 16px}
  .score .num{font-size:22px}
  .score .pct{font-size:12px}
  .hero{margin-bottom:8px}
  .tablehead{padding:5px 14px}
  .btn.small{padding:3px 8px}
  th{padding:4px 12px}
  table.main td,.tablecard table:not(.main):not(.vt) td{padding:1px 14px}
  .big{font-size:14px}
  .lead{font-size:13px}
  td.casino{font-size:14px}
  .tag{padding:0 6px;font-size:10px}
  details.grupos{margin-top:8px}
  details.grupos summary{padding:6px 14px}
  .vt .g{height:25px;font-size:13px}
  .vt td{padding:1px 10px}
  .form .hint{display:none}
  .form h2{margin-bottom:8px}
  .fields{margin-bottom:8px}
  .field label{margin-bottom:3px}
  .field input{padding:5px 10px}
  .sw{width:26px;height:26px}
  .keys{margin-top:6px}
  .err{min-height:0;margin-top:4px}
  .actions{margin-top:6px}
  .card{padding:10px 14px}
  .card.hero,.tablecard,details.grupos{padding:0}
}

/* ---- más angosto ---- */
.wrap{max-width:760px}
header .tabs{margin:0;width:max-content;max-width:100%}
header{row-gap:8px}
table.main th:first-child,table.main td:first-child{width:1%;padding-right:18px}
.dumb{min-width:120px}

@media (min-width:701px) and (max-height:800px){

@media (max-width:700px){

/* ---- marco y centrado vertical ---- */
:root{--page:#e6dfd8;--frame1:#8a5d3c;--frame2:#5e3d25;--frame3:#3b2616;--fillet:rgba(214,170,72,.85)}
@media (prefers-color-scheme: dark) and (min-width:701px){:root:not([data-theme="light"]){--page:#0b0809;--frame1:#7a5236;--frame2:#523520;--frame3:#331f12}}
:root[data-theme="dark"]{--page:#0b0809;--frame1:#7a5236;--frame2:#523520;--frame3:#331f12}
html{background:var(--page)}
body{background:var(--page);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
.frame{width:100%;max-width:792px;padding:12px;border-radius:8px;
  background:linear-gradient(135deg,var(--frame1) 0%,var(--frame2) 38%,var(--frame3) 100%);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.45),inset -1px 0 0 rgba(0,0,0,.3)}
.frame::before{content:"";position:absolute;inset:5px;border-radius:5px;pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--fillet),inset 0 2px 0 rgba(255,255,255,.12)}
.frame{position:relative}
.frame>.wrap{position:relative;background:var(--bg);border-radius:3px;max-width:none;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.12)}
@media (max-width:700px){
  body{padding:6px;align-items:flex-start}
  .frame{padding:7px}
  .frame::before{inset:3px}
  .frame>.wrap{padding:14px 12px 24px}
  .ttl{flex:1 1 0}
  header img{height:38px}
  h1{font-size:19px}
}
@media (min-width:701px) and (max-height:800px){
  body{padding:8px}
  .frame{padding:10px}
  .frame::before{inset:4px}
  .frame>.wrap{padding-top:8px;padding-bottom:8px}
  table.main,.tablecard table:not(.vt){line-height:1.25}
  .vt .g{height:22px}
  .keys{margin-top:4px}
  .form h2{margin-bottom:2px}
  .field label{margin-bottom:2px;font-size:11px}
}

/* líneas finas entre columnas */
.tablecard table:not(.vt) th+th,.tablecard table:not(.vt) td+td{border-left:.5px solid var(--line)}
@media (max-resolution:1dppx){.tablecard table:not(.vt) th+th,.tablecard table:not(.vt) td+td{border-left-width:1px}}
</style>
</head>
<body>
<div class="frame"><div class="wrap">
  <header>
    <div class="ttl">
      <h1>Elecciones gremiales</h1>
      <div class="sub">Resultados por casino</div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>
  <main id="view"></main>

<script>
const COLORS=["azul","naranja","verde","violeta","celeste","amarillo","rosa","gris"];
const STORE="eg_datos_v2";
const DOWNLOAD_NAME="index.html";
const TEMPLATE=document.documentElement.cloneNode(true); // copia limpia para "Descargar HTML"
const ORIG_STR=JSON.stringify(JSON.parse(document.getElementById("datos").textContent));
const ORIGINAL=JSON.parse(ORIG_STR);

let DB=JSON.parse(ORIG_STR), localMod=false, fileUpdated=false;
try{
  const s=localStorage.getItem(STORE);
  if(s){
    const o=JSON.parse(s);
    // si el archivo trae datos distintos a los que había cuando se guardó, manda el archivo
    if(o&&o.base===ORIG_STR&&o.data){DB=o.data;localMod=true}
    else{localStorage.removeItem(STORE);fileUpdated=true}
  }
}catch(e){}

const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};

let hideDiff=load("eg_hideDiff","0")==="1";
let gruposOpen=load("eg_grupos","0")==="1";
let current=load("eg_tab",null);
let cmpA=null,cmpB=null;
let editing=null; // año que se está editando, o null si es nueva

const fmt=n=>n.toLocaleString("es-AR");
const pct=(a,b)=>b?(a/b*100):null;
const f1=v=>Math.abs(v).toLocaleString("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fp=v=>v==null?"—":f1(v)+"%";
const cv=n=>`var(--${n})`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const elecs=()=>[...DB.elecciones].sort((a,b)=>b.anio-a.anio);
const byYear=y=>DB.elecciones.find(e=>String(e.anio)===String(y));
const allCasinos=()=>DB.casinos;
function sumG(e,names){let f=0,r=0;names.forEach(n=>{const v=e.votos[n];if(v){f+=v[0];r+=v[1]}});return[f,r]}
const groups=()=>[
  {name:"Total",names:allCasinos()},
  {name:"Sin jubilados",names:allCasinos().filter(c=>c!==DB.jubilados)},
  {name:"Mar del Plata",names:DB.marDelPlata,hint:DB.marDelPlata.join(" + ")}
];
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function save(){store(STORE,JSON.stringify({base:ORIG_STR,data:DB}));localMod=true}

/* ---------- vista de un año ---------- */
function row(name,v,total,cls,e,hint,status){
  const col=e.color;
  if(!v){
    return `<tr class="closed ${cls||""}"><td class="casino">${esc(name)}</td><td colspan="3" style="text-align:center"><span class="tag">${status||"Cerrado"}</span></td><td class="diff">—</td></tr>`;
  }
  const [f,r]=v,em=f+r,pf=pct(f,em),pr=pct(r,em),d=f-r;
  const cell=(n,p)=>`<span class="big">${fmt(n)}</span><span class="sm">(${fp(p)})</span>`;
  const lead=d===0?`<span class="lead">Empate</span>`:
    `<span class="lead"><span class="dot" style="background:${d>0?cv("fas"):cv(col)}"></span>${d>0?"FAS":esc(e.rival)} +${fmt(Math.abs(d))}</span>`;
  return `<tr class="${cls||""}">
    <td class="casino" ${hint?`title="${esc(hint)}"`:""}>${esc(name)}</td>
    <td>${cell(f,pf)}</td>
    <td>${cell(r,pr)}</td>
    <td>${cell(em,pct(em,total))}</td>
    <td class="diff">${lead}<span class="sm">(${pf==null?"—":f1(pf-pr)+" pts"})</span></td>
  </tr>`;
}
function renderYear(y){
  const e=byYear(y),col=e.color,G=groups();
  const [F,R]=sumG(e,G[0].names),E=F+R,pf=pct(F,E),pr=pct(R,E);
  const who=(a,b)=>a>b?"FAS":a<b?esc(e.rival):"Empate";
  const kp=(t,[a,b])=>`<div class="kpi"><div class="k">${t}</div><div class="v">${who(a,b)}${a!==b?" +"+fmt(Math.abs(a-b)):""}</div><div class="d">FAS ${fmt(a)} · ${esc(e.rival)} ${fmt(b)}</div></div>`;
  const sj=sumG(e,G[1].names), jb=sumG(e,[DB.jubilados]), mdp=sumG(e,G[2].names);
  const short=([a,b])=>`${who(a,b)}${a!==b?" +"+fmt(Math.abs(a-b)):""}`;
  const closed=allCasinos().filter(c=>e.votos[c]===null);
  const missing=allCasinos().filter(c=>!(c in e.votos));
  let rows=allCasinos().filter(c=>c in e.votos).map(c=>row(c,e.votos[c],E,"",e)).join("");
  rows+=G.map((g,k)=>row(g.name,sumG(e,g.names),E,"sum"+(k===0?" first":""),e,g.hint)).join("");
  const notes=[];
  if(closed.length)notes.push(`${closed.join(", ")}: casino cerrado, sin votación.`);
  return `
  <section class="card hero">
    <div class="score ${F>R?"win":""}">
      <div class="lbl"><span class="chip" style="background:${cv("fas")}"></span>Lista FAS</div>
      <div class="num">${fmt(F)}</div><div class="pct">${fp(pf)} de los votos</div>
    </div>
    <div class="score ${R>F?"win":""}">
      <div class="lbl"><span class="chip" style="background:${cv(col)}"></span>Lista ${esc(e.rival)}</div>
      <div class="num">${fmt(R)}</div><div class="pct">${fp(pr)} de los votos</div>
    </div>
    <div class="splitbar">
      <div class="bar"><div style="width:${pf||0}%;background:${cv("fas")}"></div><div style="width:${pr||0}%;background:${cv(col)}"></div></div>
      <div class="barmeta"><span><b>${fmt(E)}</b> votos emitidos</span><span>Diferencia: <b>${fmt(Math.abs(F-R))} votos</b> (${pf==null?"—":f1(pf-pr)+" pts"}) ${F===R?"":"a favor de "+who(F,R)}</span></div>
    </div>
  </section>
  <section class="card tablecard ${hideDiff?"hidediff":""}" id="tbl">
    <div class="tablehead">
      <h2>Resultados por casino${notes.length?`<span class="hnote">${notes.join(" ")}</span>`:""}</h2>
      <div class="hbtns">
        <button class="btn small" id="toggleDiff">${hideDiff?"Ver más":"Ver menos"}</button>
        <button class="btn small" id="editYear">Editar</button>
        <button class="btn small danger" id="delYear">Eliminar</button>
      </div>
    </div>
    <div class="scroll"><table class="main">
      <thead><tr><th>Casino</th><th><span class="th"><span class="chip" style="background:${cv("fas")}"></span>FAS</span></th><th><span class="th"><span class="chip" style="background:${cv(col)}"></span>${esc(e.rival)}</span></th><th>Emitidos</th><th class="diff">Diferencia</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </section>
  <details class="card grupos" id="grupos" ${gruposOpen?"open":""}>
    <summary>
      <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4l6 6-6 6"/></svg>
      Resumen por grupo
      <span class="peek">Sin jubilados: ${short(sj)} · Jubilados: ${short(jb)} · Mar del Plata: ${short(mdp)}</span>
    </summary>
    <div class="kpis">${kp("Sin jubilados",sj)}${kp("Jubilados",jb)}${kp("Mar del Plata",mdp)}</div>
  </details>`;
}

/* ---------- comparación ---------- */
function renderCmp(){
  const L=elecs();
  if(L.length<2)return `<div class="card">Hace falta cargar al menos dos elecciones para comparar.</div>`;
  if(!byYear(cmpA))cmpA=L[1].anio; if(!byYear(cmpB))cmpB=L[0].anio;
  const A=byYear(cmpA),B=byYear(cmpB),G=groups();
  const opts=sel=>L.map(e=>`<option value="${e.anio}" ${String(e.anio)===String(sel)?"selected":""}>${e.anio} · vs ${esc(e.rival)}</option>`).join("");
  const [fA,rA]=sumG(A,G[0].names),[fB,rB]=sumG(B,G[0].names);
  const pA=pct(fA,fA+rA),pB=pct(fB,fB+rB);
  const lines=[...allCasinos().map(c=>({name:c,names:[c],single:true})),...G.map(g=>({name:g.name,names:g.names,sum:true}))];
  let first=true;
  const rows=lines.map(l=>{
    const get=e=>{if(l.single){const v=e.votos[l.name];return v||null}return sumG(e,l.names)};
    const a=get(A),b=get(B);
    const xa=a&&(a[0]+a[1])?pct(a[0],a[0]+a[1]):null, xb=b&&(b[0]+b[1])?pct(b[0],b[0]+b[1]):null;
    const cls=l.sum?("sum"+(first?" first":"")):""; if(l.sum)first=false;
    const why=e=>e.votos[l.name]===null?"Cerrado":"Sin datos";
    let dumb;
    if(xa!=null&&xb!=null){
      const lo=Math.min(xa,xb),hi=Math.max(xa,xb);
      dumb=`<div class="dumb"><div class="track"></div><div class="mid"></div><div class="seg" style="left:${lo}%;width:${hi-lo}%"></div><div class="p" style="left:${xa}%;background:var(--muted)"></div><div class="p" style="left:${xb}%;background:var(--fas)"></div></div>`;
    }else dumb=`<span class="tag">${xa==null?why(A)+" en "+A.anio:why(B)+" en "+B.anio}</span>`;
    const d=(xa!=null&&xb!=null)?xb-xa:null;
    return `<tr class="${cls}${(xa==null||xb==null)?" closed":""}">
      <td class="casino">${esc(l.name)}</td>
      <td class="pc">${fp(xa)}</td><td class="pc">${fp(xb)}</td>
      <td class="${d==null?"":d>=0?"cmp-pos":"cmp-neg"}">${d==null?"—":(d>=0?"+":"−")+f1(d)+" pts"}</td>
      <td style="text-align:left;min-width:110px">${dumb}</td>
      <td>${a?fmt(a[0]+a[1]):"—"}</td><td>${b?fmt(b[0]+b[1]):"—"}</td>
    </tr>`;
  }).join("");
  return `
  <div class="legend" style="margin-bottom:14px;font-size:14px">
    <span>Comparar</span><select id="selA">${opts(cmpA)}</select><span>con</span><select id="selB">${opts(cmpB)}</select>
  </div>
  <section class="card hero">
    <div class="score">
      <div class="lbl"><span class="chip" style="background:var(--muted)"></span>FAS ${A.anio} · vs ${esc(A.rival)}</div>
      <div class="num">${fp(pA)}</div><div class="pct">${fmt(fA)} votos de ${fmt(fA+rA)}</div>
    </div>
    <div class="score">
      <div class="lbl"><span class="chip" style="background:var(--fas)"></span>FAS ${B.anio} · vs ${esc(B.rival)}</div>
      <div class="num">${fp(pB)}</div><div class="pct">${fmt(fB)} votos de ${fmt(fB+rB)} · ${pB>=pA?"+":"−"}${f1(pB-pA)} pts</div>
    </div>
  </section>
  <section class="card tablecard">
    <div class="tablehead">
      <h2>Porcentaje de FAS por casino</h2>
      <div class="legend"><span><span class="dot" style="background:var(--muted)"></span>${A.anio}</span><span><span class="dot" style="background:var(--fas)"></span>${B.anio}</span><span>línea central = 50%</span></div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Casino</th><th>FAS ${A.anio}</th><th>FAS ${B.anio}</th><th>Cambio</th><th style="text-align:left">0% — 50% — 100%</th><th>Emitidos ${A.anio}</th><th>Emitidos ${B.anio}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="note">Los subtotales suman solo los casinos que votaron en cada elección.</div>
  </section>`;
}

/* ---------- formulario: nueva elección / editar ---------- */
function renderForm(){
  const base=editing?byYear(editing):null;
  const last=elecs()[0];
  const anio=base?base.anio:(last?last.anio+3:new Date().getFullYear());
  const rival=base?base.rival:"";
  const color=base?base.color:(COLORS.find(c=>!DB.elecciones.some(e=>e.color===c))||"azul");
  const rows=allCasinos().map(c=>{
    const v=base?base.votos[c]:undefined, off=base&&v===null;
    return frow(c,v?v[0]:"",v?v[1]:"",off,false);
  }).join("");
  return `
  <section class="card form" id="form">
    <h2>${base?"Editar elección "+base.anio:"Nueva elección"}</h2>
    <p class="hint">Cargá los votos de cada casino como en Excel. Si un casino no votó, marcá «Cerrado». Podés agregar casinos nuevos al final o pegar columnas copiadas de Excel.</p>
    <div class="fields">
      <div class="field"><label for="fAnio">Año</label><input id="fAnio" type="number" min="1990" max="2100" value="${anio}"></div>
      <div class="field"><label for="fRival">Lista opositora</label><input id="fRival" type="text" placeholder="Ej.: Verde" value="${esc(rival)}"></div>
      <div class="field col"><label>Color</label><div class="swatches" id="fColor">${COLORS.map(c=>`<button type="button" class="sw" data-c="${c}" aria-pressed="${c===color}" title="${c}" style="background:${cv(c)}"></button>`).join("")}</div></div>
    </div>
    <div class="scroll" style="border:1px solid var(--line);border-radius:10px">
      <table class="vt" style="min-width:520px">
        <thead><tr><th>Casino</th><th>FAS</th><th id="hRival">${esc(rival)||"Opositora"}</th><th>Emitidos</th><th style="text-align:center">Cerrado</th></tr></thead>
        <tbody id="fRows">${rows}</tbody>
        <tbody><tr class="sum first"><td>Total</td><td id="tF">0</td><td id="tR">0</td><td id="tE">0</td><td></td></tr></tbody>
      </table>
    </div>
    <div class="keys"><button class="btn small" id="addCasino" type="button">+ Agregar casino</button><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <kbd>Enter</kbd> <kbd>Tab</kbd> moverse</span><span><kbd>F2</kbd> corregir</span><span><kbd>Supr</kbd> borrar</span><span><kbd>Espacio</kbd> cerrado</span><span><kbd>Esc</kbd> deshacer</span></div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      ${datosCard()}
      <button class="btn" id="fCancel" type="button">Cancelar</button>
      <button class="btn primary" id="fSave" type="button">${base?"Guardar cambios":"Guardar elección"}</button>
    </div>
  </section>`;
}
function frow(c,f,r,off,isNew){
  return `<tr class="${off?"off":""}" data-c="${esc(c)}">
    ${isNew?`<td class="gc"><input class="g newname" data-col="0" type="text" readonly placeholder="Nombre del casino" autocomplete="off"></td>`:`<td class="casino">${esc(c)}</td>`}
    <td class="gc"><input class="g vf" data-col="1" type="text" inputmode="numeric" readonly autocomplete="off" value="${f}"></td>
    <td class="gc"><input class="g vr" data-col="2" type="text" inputmode="numeric" readonly autocomplete="off" value="${r}"></td>
    <td class="pc em">—</td>
    <td class="gc"><div class="g gchk" data-col="3" tabindex="0" role="checkbox" aria-checked="${off?"true":"false"}"><span class="box"></span></div></td>
  </tr>`;
}
const isOff=tr=>tr.querySelector(".gchk").getAttribute("aria-checked")==="true";
function bindForm(){
  const $=id=>document.getElementById(id);
  const body=$("fRows");
  const recalc=()=>{
    let F=0,R=0;
    body.querySelectorAll("tr").forEach(tr=>{
      const off=isOff(tr);
      const f=+tr.querySelector(".vf").value||0, r=+tr.querySelector(".vr").value||0;
      tr.classList.toggle("off",off);
      const blank=tr.querySelector(".vf").value===""&&tr.querySelector(".vr").value==="";
      tr.querySelector(".em").textContent=(off||blank)?"—":fmt(f+r);
      if(!off){F+=f;R+=r}
    });
    $("tF").textContent=fmt(F);$("tR").textContent=fmt(R);$("tE").textContent=fmt(F+R);
  };

  /* ---- grilla tipo Excel ---- */
  let sel=null, mode="nav", orig="";
  const rows=()=>[...body.querySelectorAll("tr")];
  const cellAt=(r,c)=>{const tr=rows()[r];return tr?tr.querySelector(`[data-col="${c}"]`):null};
  const pos=el=>({r:rows().indexOf(el.closest("tr")),c:+el.dataset.col});
  const isNum=el=>el.classList.contains("vf")||el.classList.contains("vr");
  const isChk=el=>el.classList.contains("gchk");
  function select(el){
    if(!el)return;
    if(mode!=="nav")commit();
    if(sel)sel.parentElement.classList.remove("sel");
    sel=el;el.parentElement.classList.add("sel");
    el.focus();
    if(el.setSelectionRange){try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
  }
  function startEdit(m,ch){
    if(!sel||isChk(sel))return;
    if(isNum(sel)&&isOff(sel.closest("tr")))return;
    orig=sel.value;mode=m;sel.readOnly=false;sel.parentElement.classList.add("editing");
    if(ch!=null)sel.value=ch;
    const n=sel.value.length;sel.setSelectionRange(n,n);
  }
  function commit(){
    if(!sel||mode==="nav")return;
    if(isNum(sel))sel.value=sel.value.replace(/\D/g,"");
    else sel.value=sel.value.trim();
    sel.readOnly=true;sel.parentElement.classList.remove("editing");mode="nav";recalc();
  }
  function cancel(){if(!sel)return;sel.value=orig;sel.readOnly=true;sel.parentElement.classList.remove("editing");mode="nav";recalc()}
  function move(dr,dc,wrap){
    if(!sel)return;
    let {r,c}=pos(sel);const R=rows().length;
    if(dr){for(let k=r+dr;k>=0&&k<R;k+=dr){const el=cellAt(k,c);if(el)return select(el)}return select(sel)}
    for(let k=c+dc;;k+=dc){
      if(k<0||k>3){if(!wrap)return select(sel);r+=dc;if(r<0||r>=R)return select(sel);k=dc>0?-1:4;continue}
      const el=cellAt(r,k);if(el)return select(el);
    }
  }
  function toggle(el){
    const v=el.getAttribute("aria-checked")!=="true";el.setAttribute("aria-checked",v);recalc();
  }
  body.addEventListener("keydown",ev=>{
    const el=ev.target.closest(".g");if(!el)return;
    if(el!==sel)select(el);
    const k=ev.key, sh=ev.shiftKey;
    if(mode==="nav"){
      if(k==="ArrowDown"){ev.preventDefault();move(1,0)}
      else if(k==="ArrowUp"){ev.preventDefault();move(-1,0)}
      else if(k==="ArrowRight"){ev.preventDefault();move(0,1)}
      else if(k==="ArrowLeft"){ev.preventDefault();move(0,-1)}
      else if(k==="Enter"){ev.preventDefault();move(sh?-1:1,0)}
      else if(k==="Tab"){ev.preventDefault();move(0,sh?-1:1,true)}
      else if(k==="F2"){ev.preventDefault();startEdit("edit")}
      else if(k===" "&&isChk(el)){ev.preventDefault();toggle(el)}
      else if((k==="Delete"||k==="Backspace")){ev.preventDefault();
        if(isChk(el)){el.setAttribute("aria-checked","false");recalc()}
        else if(!(isNum(el)&&isOff(el.closest("tr")))){el.value="";recalc()}}
      else if(k.length===1&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
        ev.preventDefault();
        if(isChk(el)){if(/[xX ]/.test(k))toggle(el);return}
        if(isNum(el)&&!/\d/.test(k))return;
        startEdit("enter",k);
      }
      return;
    }
    // editando
    if(k==="Escape"){ev.preventDefault();cancel();return}
    if(k==="Enter"){ev.preventDefault();commit();move(sh?-1:1,0);return}
    if(k==="Tab"){ev.preventDefault();commit();move(0,sh?-1:1,true);return}
    if(k==="ArrowDown"||k==="ArrowUp"){ev.preventDefault();commit();move(k==="ArrowDown"?1:-1,0);return}
    if(mode==="enter"&&(k==="ArrowRight"||k==="ArrowLeft")){ev.preventDefault();commit();move(0,k==="ArrowRight"?1:-1);return}
    if(isNum(el)&&k.length===1&&!ev.ctrlKey&&!ev.metaKey&&!/\d/.test(k))ev.preventDefault();
  });
  body.addEventListener("input",()=>{if(sel&&isNum(sel)){const p=sel.selectionStart,v=sel.value,c=v.replace(/\D/g,"");if(c!==v){sel.value=c;sel.setSelectionRange(p-1,p-1)}}recalc()});
  let touch=false;
  body.addEventListener("pointerdown",ev=>{touch=ev.pointerType==="touch"});
  body.addEventListener("mousedown",ev=>{const el=ev.target.closest(".g");if(el&&el!==sel){ev.preventDefault();select(el)}});
  body.addEventListener("click",ev=>{
    const el=ev.target.closest(".g");if(!el)return;
    if(el!==sel)select(el);
    if(isChk(el)){toggle(el);return}
    if(touch&&mode==="nav")startEdit("edit");
  });
  body.addEventListener("dblclick",ev=>{const el=ev.target.closest(".g");if(el&&!isChk(el)){select(el);startEdit("edit")}});
  body.addEventListener("focusout",ev=>{if(mode!=="nav"&&!body.contains(ev.relatedTarget))commit()});
  body.addEventListener("paste",ev=>{
    if(!sel||mode!=="nav")return;
    const txt=(ev.clipboardData||window.clipboardData).getData("text");if(!txt)return;
    ev.preventDefault();
    const lines=txt.replace(/\r/g,"").split("\n");if(lines.length>1&&lines[lines.length-1]==="")lines.pop();
    const {r,c}=pos(sel);
    lines.forEach((ln,i)=>ln.split("\t").forEach((v,j)=>{
      const el=cellAt(r+i,c+j);if(!el)return;
      if(isChk(el)){if(/^(x|si|sí|cerrado|1|true|verdadero)$/i.test(v.trim())){el.setAttribute("aria-checked","true")}return}
      if(isNum(el)){if(isOff(el.closest("tr")))return;el.value=v.replace(/\D/g,"")}else el.value=v.trim();
    }));
    recalc();toast(`Pegado: ${lines.length} fila${lines.length>1?"s":""}`);
  });

  $("fAnio").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();$("fRival").focus()}});
  $("fRival").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();select(cellAt(0,1))}});
  $("fRival").addEventListener("input",()=>$("hRival").textContent=$("fRival").value.trim()||"Opositora");
  $("fColor").addEventListener("click",ev=>{const b=ev.target.closest(".sw");if(!b)return;$("fColor").querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s===b))});
  $("addCasino").onclick=()=>{body.insertAdjacentHTML("beforeend",frow("","","",false,true));recalc();select(body.lastElementChild.querySelector(".newname"));startEdit("edit")};
  $("fCancel").onclick=()=>{const y=editing;editing=null;go(y?String(y):String(elecs()[0]?.anio||"cmp"))};
  $("fSave").onclick=()=>{
    const err=m=>{$("fErr").textContent=m};
    const anio=parseInt($("fAnio").value,10), rival=$("fRival").value.trim();
    const color=$("fColor").querySelector('[aria-pressed="true"]')?.dataset.c||"azul";
    if(!anio||anio<1990||anio>2100)return err("Poné un año válido.");
    if(!rival)return err("Falta el nombre de la lista opositora.");
    if(DB.elecciones.some(e=>e.anio===anio&&e.anio!==editing))return err(`Ya existe una elección ${anio}. Editala desde su pestaña.`);
    const votos={},nuevos=[];let any=false;
    for(const tr of $("fRows").querySelectorAll("tr")){
      let c=tr.dataset.c;
      const nn=tr.querySelector(".newname");
      if(nn){c=nn.value.trim();const fv=tr.querySelector(".vf").value,rv=tr.querySelector(".vr").value;
        if(!c){if(fv===""&&rv==="")continue;return err("Hay un casino nuevo sin nombre.")}
        if(allCasinos().includes(c)||nuevos.includes(c))return err(`El casino «${c}» ya está en la lista.`);
        nuevos.push(c)}
      if(isOff(tr)){votos[c]=null;continue}
      const fs=tr.querySelector(".vf").value,rs=tr.querySelector(".vr").value;
      if(fs===""&&rs===""){continue}
      const f=Number(fs||0),r=Number(rs||0);
      if(!Number.isInteger(f)||!Number.isInteger(r)||f<0||r<0)return err(`Revisá los votos de ${c}: tienen que ser números enteros.`);
      votos[c]=[f,r];any=true;
    }
    if(!any)return err("Cargá los votos de al menos un casino.");
    const vacios=allCasinos().filter(c=>!(c in votos));
    if(vacios.length&&!$("fSave").dataset.confirm){
      $("fSave").dataset.confirm="1";$("fSave").textContent="Guardar igual";
      return err(`Sin votos cargados: ${vacios.join(", ")}. Si no votaron, marcalos «Cerrado». Para guardar así, tocá de nuevo.`);
    }
    // jubilados queda al final de la lista
    nuevos.forEach(c=>{const j=DB.casinos.indexOf(DB.jubilados);if(j>=0)DB.casinos.splice(j,0,c);else DB.casinos.push(c)});
    const rec={anio,rival,color,votos};
    if(editing!=null)DB.elecciones=DB.elecciones.map(e=>e.anio===editing?rec:e); else DB.elecciones.push(rec);
    save();editing=null;toast(`Elección ${anio} guardada`);go(String(anio));
  };
  recalc();
}

/* ---------- datos: descargar / restaurar ---------- */
function datosCard(){
  return `<div class="datos">
    <button class="btn" id="dl" type="button" title="Baja un archivo nuevo con todas las elecciones adentro">Descargar HTML actualizado</button>
    ${localMod?`<button class="btn danger" id="reset" type="button">Volver a los datos del archivo</button>`:""}
    <span class="dlnote">Lo cargado queda en este navegador. <span class="dlwhy">Para que lo vean todos, descargá el HTML y subilo a GitHub como index.html.</span></span>
  </div>`;
}
function bindDatos(){
  const dl=document.getElementById("dl");
  if(dl)dl.onclick=()=>{
    const doc=TEMPLATE.cloneNode(true);
    doc.querySelector("#datos").textContent="\n"+JSON.stringify(DB,null,1)+"\n";
    const html="<!doctype html>\n"+doc.outerHTML;
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download=DOWNLOAD_NAME;document.body.appendChild(a);a.click();a.remove();
    toast("HTML descargado");
  };
  const rs=document.getElementById("reset");
  if(rs)rs.onclick=()=>{
    if(!rs.classList.contains("armed")){rs.classList.add("armed");rs.textContent="¿Seguro? Se borran los cambios de este navegador";return}
    try{localStorage.removeItem(STORE)}catch(e){}
    DB=JSON.parse(JSON.stringify(ORIGINAL));localMod=false;toast("Datos restaurados");go(String(elecs()[0].anio));
  };
}

/* ---------- navegación ---------- */
function renderTabs(){
  const t=elecs().map(e=>`<button class="tab" role="tab" data-v="${e.anio}">Elecciones ${e.anio}</button>`).join("")
    +`<button class="tab" role="tab" data-v="cmp">Comparar</button>`
    +`<button class="tab add" role="tab" data-v="new">+ Nueva elección</button>`;
  const el=document.getElementById("tabs");el.innerHTML=t;
  el.querySelectorAll(".tab").forEach(b=>{b.setAttribute("aria-selected",b.dataset.v===current);b.onclick=()=>{if(b.dataset.v==="new")editing=null;go(b.dataset.v)}});
  el.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest",inline:"nearest"});
}
function go(v){current=v;if(v!=="new")store("eg_tab",v);render()}
function render(){
  if(current!=="cmp"&&current!=="new"&&!byYear(current))current=String(elecs()[0]?.anio||"new");
  renderTabs();
  const view=document.getElementById("view");
  if(current==="new"){view.innerHTML=renderForm();bindForm();bindDatos();return}
  if(current==="cmp"){
    view.innerHTML=renderCmp();
    const a=document.getElementById("selA"),b=document.getElementById("selB");
    if(a){a.onchange=()=>{cmpA=a.value;render()};b.onchange=()=>{cmpB=b.value;render()}}
    return;
  }
  view.innerHTML=renderYear(current);
  const tg=document.getElementById("toggleDiff");
  tg.onclick=()=>{hideDiff=!hideDiff;store("eg_hideDiff",hideDiff?"1":"0");document.getElementById("tbl").classList.toggle("hidediff",hideDiff);tg.textContent=hideDiff?"Ver más":"Ver menos"};
  document.getElementById("grupos").addEventListener("toggle",ev=>{gruposOpen=ev.target.open;store("eg_grupos",gruposOpen?"1":"0")});
  document.getElementById("editYear").onclick=()=>{editing=byYear(current).anio;current="new";render()};
  const del=document.getElementById("delYear");
  del.onclick=()=>{
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent=`¿Eliminar ${current}? Confirmá`;return}
    const y=current;DB.elecciones=DB.elecciones.filter(e=>String(e.anio)!==String(y));save();toast(`Elección ${y} eliminada`);go(String(elecs()[0]?.anio||"new"));
  };
}
render();
if(fileUpdated)setTimeout(()=>toast("Se cargaron los datos nuevos del archivo"),300);
</script>

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
